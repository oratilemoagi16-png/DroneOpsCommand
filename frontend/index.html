<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Opsdeck v2</title>
    <meta name="description" content="Mission management, flight log analysis, AI report generation, invoicing, and real-time airspace monitoring for commercial drone operators. FAA Part 107 ready." />
    <meta name="keywords" content="drone operations, mission management, flight logs, DJI, FAA Part 107, drone software, flight telemetry, airspace monitoring, OpenSky, AI reports, drone invoicing, commercial drone, flight path map, GPS track, drone fleet management" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Opsdeck v2" />
    <meta property="og:description" content="Mission management, flight log analysis, AI report generation, and invoicing for commercial drone operators." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Opsdeck v2" />
    <meta name="twitter:description" content="Drone mission management, flight log analysis, AI reports, and invoicing. FAA Part 107 ready." />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- PWA & theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050608" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Opsdeck v2" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Fonts & styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
